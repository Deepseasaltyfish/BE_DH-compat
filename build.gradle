buildscript {
    repositories {
        // These repositories are only for Gradle plugins, put any other repositories in the repository block further below
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' } // DH Requirement

        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT' // DH Requirement
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin' // DH Requirement


version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile',
                    "${projectDir}/build/createSrgToMcp/output.srg"
            arg '-mixin.config=be_lod_compat.mixins.json'
        }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile',
                    "${projectDir}/build/createSrgToMcp/output.srg"
            arg '-mixin.config=be_lod_compat.mixins.json'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url = "https://api.modrinth.com/maven" } // DH Requirement
    maven { url = "https://teamopenindustry.cc/maven" }
    maven { url = "https://cursemaven.com" }

    // DH Optional Requirement
    // Required if using a local DH jar
    // (this directory is relative to the project's root)
    flatDir { dir 'libs' }
}

configurations {
    sqlite
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // this is necessary since DH uses mixins, for more information please visit:
    // https://github.com/SpongePowered/Mixin/wiki/Mixins-on-Minecraft-Forge
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Add the DH Api for compile time development
    compileOnly fg.deobf("maven.modrinth:DistantHorizonsApi:6.0.0") // maven
//    compileOnly fg.deobf("blank:DistantHorizonsAPI:4.0.0-b-dev") // local Jar file, ile should be named in the format: "DistantHorizonsAPI-VERSION.jar"  IE "DistantHorizonsAPI-2.0.0a-dev.jar"

    // SQLite 支持 - 排除 slf4j 传递依赖
    implementation('org.xerial:sqlite-jdbc:3.44.1.0') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }

    // 给打包配置也加同样的排除
    sqlite('org.xerial:sqlite-jdbc:3.44.1.0') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }

    // Add the Full DH mod for runtime use
    // Note: Don't add this with "Implementation", otherwise you may
    // accidentally use non-API methods that could change without notice
    runtimeOnly fg.deobf("curse.maven:embeddium-908741:5630140")
    runtimeOnly fg.deobf("curse.maven:oculus-581495:6020952")
    implementation fg.deobf("maven.modrinth:DistantHorizons:3.0.1-b-1.20.1") // maven
//    runtimeOnly fg.deobf("blank:DistantHorizons:2.3.0-b-dev") // local Jar file, file should use the name format: "DistantHorizons-VERSION.jar"  IE "DistantHorizons-2.0.0a-dev.jar"
    runtimeOnly fg.deobf('cam72cam.universalmodcore:UniversalModCore:1.20.1-forge-1.2.3-8ec6ff1')
    runtimeOnly fg.deobf('trackapi:TrackAPI:1.20.1-forge-1.2')
    runtimeOnly files('libs/ImmersiveRailroading-1.20.1-forge-1.10.0-a23fd01.jar')
}

mixin {
    add sourceSets.main, 'be_lod_compat.refmap.json'
    config 'be_lod_compat.mixins.json'
    debug.verbose = true
    debug.export = true
}


tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    // 把 sqlite-jdbc 的类和原生库打包进来
//    from {
//        configurations.sqlite.collect { it.isDirectory() ? it : zipTree(it) }
//    }

    // 排除签名文件，避免 SecurityException
    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
